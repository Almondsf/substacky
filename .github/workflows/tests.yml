name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: substacky
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: substacky
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      PAYSTACK_SECRET_KEY: sk_test_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file /dev/null --fail-on-warn
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/schema/ > /dev/null
          curl --fail --silent --show-error http://localhost:8000/static/admin/css/base.css > /dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Tenant: missing' http://localhost:8000/api/tenants/current/)
          test "$code" = "404"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
